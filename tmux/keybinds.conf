# claude-tmux keybinding — popup picker
# Sourced from ~/.tmux.conf by install.sh.
bind-key a display-popup -E -w 140 -h 36 -b rounded -s 'fg=#1c1c22' "cct"

# Mark pane as viewed whenever it becomes the active pane.
set-hook -g pane-focus-in 'run-shell -b "cct-mark-viewed #{pane_id}"'

# Status-line segment showing live needs-input badge.
# Source tmux/status.conf if you want this; off by default.
